name: Windows host checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: Portable host checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run portable host checks
        shell: bash
        run: |
          portable=()
          for file in test/*.test.js; do
            if [[ "$file" != "test/interface.test.js" ]]; then portable+=("$file"); fi
          done
          node --require ./test/use-sandbox-home.cjs --test "${portable[@]}"
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: dotnet build RemoteAgent/RemoteAgent.csproj -c Release -o RemoteAgent/bin --nologo
      - run: dotnet run --project test/FrameEncoderChecks/FrameEncoderChecks.csproj -c Release
      - run: dotnet run --project test/CaptureCursorChecks/CaptureCursorChecks.csproj -c Release
      - run: dotnet run --project test/AudioCodecChecks/AudioCodecChecks.csproj -c Release
      - run: dotnet build HostTray/HostTray.csproj -c Release --nologo
      - run: dotnet run --project test/HostTrayChecks/HostTrayChecks.csproj -c Release
      - run: dotnet run --project test/PhoneDeskChecks/PhoneDeskChecks.csproj -c Release
