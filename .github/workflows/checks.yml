name: Windows host checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: dotnet build RemoteAgent/RemoteAgent.csproj -c Release -o RemoteAgent/bin --nologo
      - run: dotnet run --project test/FrameEncoderChecks/FrameEncoderChecks.csproj -c Release
