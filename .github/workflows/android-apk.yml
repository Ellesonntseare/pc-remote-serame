name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
      - 'server.js'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run portable host checks
        # The served Windows UI integration suite runs in checks.yml on Windows.
        # Keep Android compilation independent of Linux emulation of that UI.
        shell: bash
        run: |
          portable=()
          for file in test/*.test.js; do
            if [[ "$file" != "test/interface.test.js" ]]; then portable+=("$file"); fi
          done
          node --require ./test/use-sandbox-home.cjs --test "${portable[@]}"
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Load persistent personal preview signing key
        env:
          STORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$STORE_B64" && test -n "$STORE_PASSWORD"
          printf '%s' "$STORE_B64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/pcremote-preview.p12"
          chmod 600 "$RUNNER_TEMP/pcremote-preview.p12"
          printf 'PCR_SIGNING_STORE=%s\n' "$RUNNER_TEMP/pcremote-preview.p12" >> "$GITHUB_ENV"
      - name: Build debug APK
        env:
          PCR_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle :android:testDebugUnitTest :android:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature and version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/build/outputs/apk/debug/android-debug.apk > apk-signature.txt
          cat apk-signature.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 1803b0080ad05d54df52de3a61fa4a9978244ca51e9df842d0303d42636c11eb' apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/build/outputs/apk/debug/android-debug.apk > apk-metadata.txt
          sed -n '1,8p' apk-metadata.txt
          grep -q "android.permission.CAMERA" apk-metadata.txt
          grep -q "android.permission.RECORD_AUDIO" apk-metadata.txt
          sha256sum android/build/outputs/apk/debug/android-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PC-Remote-Android-APK
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 30
