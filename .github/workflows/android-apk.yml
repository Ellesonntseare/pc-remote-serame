name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
      - 'server.js'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run server security tests
        run: npm test
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Keep debug signing consistent for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pc-remote-android-debug-signing-v1
      - name: Build debug APK
        run: gradle :android:testDebugUnitTest :android:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature and version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/build/outputs/apk/debug/android-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/build/outputs/apk/debug/android-debug.apk > apk-metadata.txt
          sed -n '1,8p' apk-metadata.txt
          sha256sum android/build/outputs/apk/debug/android-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PC-Remote-Android-APK
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 30
