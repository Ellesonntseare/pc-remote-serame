name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Upload the verified personal preview directly to its draft release
        type: boolean
        default: false
      skip_artifact:
        description: Run validation without keeping a temporary APK artifact
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Load persistent personal preview signing key
        env:
          STORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$STORE_B64" && test -n "$STORE_PASSWORD"
          printf '%s' "$STORE_B64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/pcremote-preview.p12"
          chmod 600 "$RUNNER_TEMP/pcremote-preview.p12"
          printf 'PCR_SIGNING_STORE=%s\n' "$RUNNER_TEMP/pcremote-preview.p12" >> "$GITHUB_ENV"
      - name: Build debug APK
        env:
          PCR_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle :android:testDebugUnitTest :android:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature and version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/build/outputs/apk/debug/android-debug.apk > apk-signature.txt
          cat apk-signature.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 1803b0080ad05d54df52de3a61fa4a9978244ca51e9df842d0303d42636c11eb' apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/build/outputs/apk/debug/android-debug.apk > apk-metadata.txt
          sed -n '1,8p' apk-metadata.txt
          grep -q "application-label:'Elleson Connect'" apk-metadata.txt
          grep -q "name='za.co.pcremote.controller' versionCode='24' versionName='2.3.1'" apk-metadata.txt
          grep -q "android.permission.CAMERA" apk-metadata.txt
          grep -q "android.permission.RECORD_AUDIO" apk-metadata.txt
          grep -q "android.permission.MODIFY_AUDIO_SETTINGS" apk-metadata.txt
          grep -q "android.permission.FOREGROUND_SERVICE_DATA_SYNC" apk-metadata.txt
          sha256sum android/build/outputs/apk/debug/android-debug.apk
      - name: Upload installable APK
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.publish_release && !inputs.skip_artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Elleson-Connect-Android-APK
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload personal APK to draft release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v2.3.1-preview || gh release create v2.3.1-preview --draft --prerelease --target "$GITHUB_SHA" --title "Elleson Connect 2.3.1 Personal Preview" --notes "Control your Android phone using your PC mouse: visible phone pointer, mouse capture with Escape to release, wheel scrolling and main-account phone sharing. Install over the existing personal app."
          test "$(gh release view v2.3.1-preview --json isDraft --jq .isDraft)" = true || { echo 'Refusing to overwrite a published release.'; exit 1; }
          cp android/build/outputs/apk/debug/android-debug.apk Elleson-Connect-Android-2.3.1.apk
          gh release upload v2.3.1-preview Elleson-Connect-Android-2.3.1.apk --clobber

