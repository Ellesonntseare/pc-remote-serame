name: Build Windows host installer
on:
  push:
    branches: [main]
    paths: ['HostTray/**', 'installer/**', 'RemoteAgent/**', 'public/**', '*.js', 'index.html', 'package*.json', '.github/workflows/windows-installer.yml']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Upload the verified personal preview directly to its draft release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish tray and desktop agent
        shell: pwsh
        run: |
          dotnet publish HostTray/HostTray.csproj -c Release -r win-x64 --self-contained true -o dist/host-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish RemoteAgent/RemoteAgent.csproj -c Release -r win-x64 --self-contained true -o dist/host-package/host/RemoteAgent/bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle host and Node runtime
        shell: pwsh
        run: |
          npm ci --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = Join-Path $PWD 'dist/host-package/host'
          Get-ChildItem -File -Path '*.js','*.html','package.json','package-lock.json','config.example.json','LICENSE*','README.md' -ErrorAction SilentlyContinue | Copy-Item -Destination $bundle
          Copy-Item -LiteralPath public -Destination $bundle -Recurse
          Copy-Item -LiteralPath node_modules -Destination $bundle -Recurse
          New-Item -ItemType Directory -Path "$bundle/runtime" -Force | Out-Null
          Copy-Item -LiteralPath (Get-Command node).Source -Destination "$bundle/runtime/node.exe"
      - name: Verify bundled runtime, dependencies and served UI
        shell: pwsh
        run: |
          & ./dist/host-package/host/runtime/node.exe installer/verify-bundle.cjs ./dist/host-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./dist/host-package/host/RemoteAgent/bin/RemoteAgent.exe --capture-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path -LiteralPath $compiler)) { choco install innosetup --yes --no-progress; $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" }
          & $compiler installer/PCRemote.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/Elleson-Connect-Host-Setup-2.3.0.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        with:
          name: Elleson-Connect-Windows-Host-2.3.0
          path: dist/Elleson-Connect-Host-Setup-2.3.0.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        # The installer already contains this bundle. Keep the larger unpacked
        # copy only for manually requested debugging builds.
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        with:
          name: Elleson-Connect-Windows-Host-Package-2.3.0
          path: dist/host-package/
          if-no-files-found: error
          retention-days: 1

      - name: Upload personal installer to draft release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v2.3.0-preview
          if ($LASTEXITCODE -ne 0) { gh release create v2.3.0-preview --draft --prerelease --target $env:GITHUB_SHA --title "Elleson Connect 2.3.0 Personal Preview" --notes "Personal preview: direct PC typing, integrated Elleson Keyboard, shared text and picture clipboard, and redesigned Windows sharing." }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $draft = gh release view v2.3.0-preview --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Refusing to overwrite a published release.' }
          gh release upload v2.3.0-preview dist/Elleson-Connect-Host-Setup-2.3.0.exe --clobber
